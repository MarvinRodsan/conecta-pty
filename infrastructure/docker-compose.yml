# Entorno local de Conecta PTY
#   docker compose run --rm otp-construir     -> arma el grafo de rutas (primera vez)
#   docker compose up -d db otp               -> base de datos + motor de rutas
#   docker compose down                       -> apaga todo y libera la RAM
#   docker compose --profile completo up -d   -> todo, incluido el backend en contenedor
name: conecta-pty

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: conecta
      POSTGRES_USER: conecta
      POSTGRES_PASSWORD: ${DB_PASSWORD:-conecta_local}
    ports:
      - "127.0.0.1:5432:5432"   # solo tu PC, no la red Wi-Fi
    mem_limit: 512m          # de sobra para el piloto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conecta -d conecta"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── OpenTripPlanner en dos pasos, pensado para PCs de 8 GB ──────────────
  # 1) Construir el grafo UNA vez (y cada vez que cambie el GTFS o el mapa):
  #      docker compose run --rm otp-construir
  #    Lee ./otp/datos/panama-latest.osm.pbf + metro-pty-gtfs.zip y guarda graph.obj
  # 2) Servir cargando el grafo ya hecho (mucho menos memoria y arranque rápido):
  #      docker compose up -d db otp
  otp-construir:
    profiles: ["construir"]
    image: opentripplanner/opentripplanner:2.10.0
    command: ["--build", "--save"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx2g"
    mem_limit: 2600m
    volumes:
      - ./otp/datos:/var/opentripplanner

  otp:
    image: opentripplanner/opentripplanner:2.10.0
    command: ["--load", "--serve"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1200m"
    mem_limit: 1700m
    ports:
      - "127.0.0.1:8081:8080"   # solo tu PC; la app habla con el backend, no con OTP
    volumes:
      - ./otp/datos:/var/opentripplanner

  backend:
    profiles: ["completo"]
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/conecta
      DB_USER: conecta
      DB_PASSWORD: ${DB_PASSWORD:-conecta_local}
      OTP_URL: http://otp:8080
      GTFS_PATH: /datos/metro-pty-gtfs.zip
    volumes:
      - ./otp/datos:/datos:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
